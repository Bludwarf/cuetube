@if (!connectedToGoogleDrive) {
    <button id="login-btn" class="btn btn-default" (click)="connectGoogleDrive()">
        Google Drive
    </button>
}
@if (connectedToGoogleDrive) {
    <button id="logout-btn" class="btn btn-default" (click)="disconnectGoogleDrive()">
        Déconnexion
    </button>
}
